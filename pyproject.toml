[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "model-assurance-research"
version = "0.2.0rc1"
license = {file = "LICENSE"}
description = "Research prototype for multi-level statistical assurance of model changes"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "scikit-learn>=1.3,<2", "matplotlib>=3.7,<4", "PyYAML>=6,<7", "threadpoolctl>=3.1,<4"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff==0.17.5"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py310"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
